<!-- Travelsale UTM Capture -->
<script>
(function() {

  // ── CONFIG ──────────────────────────────────────────────
  var travelsaleKeywords = [
    'travelsale', 'travel_sale', 'travel-sale', 'travel.sale', 'travelsale2026', 'travelsale_2026', 'travelsale-2026', 'ts2026', 'ts_2026', 'ts-2026', 'travelsale_jun', 'travelsale_junio', 'travelsalejunio', 'travelsaleco', 'travelsale_co', 'travelsalecolombia', 'ccce', 'ccceco', 'ccce2026', 'travelsael', 'travelslae', 'travelsalee', 'epsilon'
  ];

  var foreignKeywords = [
    'always_on', 'brand_always_on'
  ];

  var referrerDomains = [
    'travelsale.com.co', 'www.travelsale.com.co',
    'travelsale.co',     'www.travelsale.co'
  ];
  // ────────────────────────────────────────────────────────

  var params    = new URLSearchParams(window.location.search);
  var utmValues = [
    params.get('utm_source'),
    params.get('utm_medium'),
    params.get('utm_campaign'),
    params.get('utm_content'),
    params.get('utm_term'),
    params.get('utm_id')
  ];

  // ── CONDITION B — Referrer is travelsale.com.co ─────────────
  var conditionB = false;
  if (document.referrer) {
    try {
      var referrerHost = new URL(document.referrer).hostname.toLowerCase();
      for (var r = 0; r < referrerDomains.length; r++) {
        if (referrerHost === referrerDomains[r]) {
          conditionB = true;
          break;
        }
      }
    } catch(e) {}
  }

  // ── CONDITION A — Travelsale keyword in any UTM ─────────────
  // Only evaluated when B failed — saves processing
  var conditionA = false;
  if (!conditionB) {
    for (var i = 0; i < utmValues.length; i++) {
      if (!utmValues[i]) continue;
      var utmLower = utmValues[i].toLowerCase();
      for (var k = 0; k < travelsaleKeywords.length; k++) {
        if (utmLower.indexOf(travelsaleKeywords[k]) !== -1) {
          conditionA = true;
          break;
        }
      }
      if (conditionA) break;
    }
  }

  // ── CONDITION C — No ally-owned signals in source/medium ─
  // Only evaluated when B failed and A passed
  var conditionC = true;
  if (!conditionB && conditionA) {
    var foreignUtmFields = [
      params.get('utm_source'),
      params.get('utm_medium'),
      params.get('utm_campaign')
    ];
    for (var i = 0; i < foreignUtmFields.length; i++) {
      if (!foreignUtmFields[i]) continue;
      var fieldLower = foreignUtmFields[i].toLowerCase();
      for (var f = 0; f < foreignKeywords.length; f++) {
        if (fieldLower.indexOf(foreignKeywords[f]) !== -1) {
          conditionC = false;
          break;
        }
      }
      if (!conditionC) break;
    }
  }

  // ── FINAL GATE ───────────────────────────────────────────
  var isTravelsale = conditionB || (conditionA && conditionC);

  if (!isTravelsale) return;

  // ── DETECTION SIGNAL — audit trail ──────────────────────
  var detectionSignal = (conditionB && conditionA) ? 'referrer+utm'  :
                         conditionB                ? 'referrer_only' :
                                                     'utm+no_foreign';
  console.log('detectionSignal:', detectionSignal);

  // ── STORE ────────────────────────────────────────────────
  var tsData = {
    utm_source:       params.get('utm_source')   || '',
    utm_medium:       params.get('utm_medium')   || '',
    utm_campaign:     params.get('utm_campaign') || '',
    utm_content:      params.get('utm_content') || '',
    utm_term:         params.get('utm_term') || '',
    utm_id:           params.get('utm_id') || '',
    store_domain:     window.location.hostname,
    referrer:         document.referrer          || '',
    detection_signal: detectionSignal,
    landed_at:        new Date().toLocaleString('sv-SE', { timeZone: 'America/Bogota' })
  };

  try {
    sessionStorage.setItem('travelsale_data', JSON.stringify(tsData));
    localStorage.setItem('travelsale_data',   JSON.stringify(tsData));
    sessionStorage.removeItem('hotsale_data');
    localStorage.removeItem('hotsale_data');
  } catch(e) {}

})();
</script>
<!-- End Travelsale UTM Capture -->
